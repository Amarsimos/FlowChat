name: FlowChatSystem release

# Push a tag like "FlowChatSystem-v1.0.1" (matching overlay/package.json version) to build and publish
on:
  push:
    tags:
      - 'FlowChatSystem-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
